<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Người dùng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
        <a class="navbar-brand" href="dashboard.html">Hệ Thống Giao Hàng</a>
        <div class="ms-auto">
            <a href="dashboard.html" class="btn btn-outline-light btn-sm me-2">Về Dashboard</a>
            <a href="index.html" class="btn btn-outline-danger btn-sm">Đăng xuất</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Quản lý Người dùng (Admin)</h2>
            <button class="btn btn-primary" onclick="alert('Form thêm user sẽ được cập nhật sau!')">+ Thêm User</button>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <table class="table table-striped mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Tên đăng nhập</th>
                            <th>Họ và Tên</th>
                            <th>Vai trò</th>
                            <th>Trạng thái</th>
                            <th>Hành động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>admin</td>
                            <td>Quản trị viên</td>
                            <td><span class="badge bg-danger">Admin</span></td>
                            <td><span class="badge bg-success">Hoạt động</span></td>
                            <td><button class="btn btn-sm btn-warning" disabled>Sửa</button></td>
                        </tr>
                        <tr>
                            <td>tthang</td>
                            <td>Cao Tấn Thắng</td>
                            <td><span class="badge bg-primary">User</span></td>
                            <td><span class="badge bg-success">Hoạt động</span></td>
                            <td>
                                <button class="btn btn-sm btn-warning" onclick="alert('Sửa user')">Sửa</button>
                                <button class="btn btn-sm btn-danger" onclick="alert('Xóa user')">Xóa</button>
                            </td>
                        </tr>
                        <tr>
                            <td>kmy</td>
                            <td>Đặng Kim Mỹ</td>
                            <td><span class="badge bg-primary">User</span></td>
                            <td><span class="badge bg-secondary">Bị khóa</span></td>
                            <td>
                                <button class="btn btn-sm btn-warning" onclick="alert('Sửa user')">Sửa</button>
                                <button class="btn btn-sm btn-danger" onclick="alert('Xóa user')">Xóa</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Gọi file JS -->
    <script src="js/users.js" defer></script>
</body>

</html>
