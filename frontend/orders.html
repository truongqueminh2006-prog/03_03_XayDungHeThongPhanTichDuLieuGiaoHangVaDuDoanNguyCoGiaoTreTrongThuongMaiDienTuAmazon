<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Đơn hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
        }

        .table-hover tbody tr:hover {
            background-color: #f1f1f1;
        }
    </style>
</head>

<body>

    <!-- Thanh điều hướng -->
    <a href="users.html" class="btn btn-outline-light btn-sm me-2">Quản lý Users</a>
    <a href="reports.html" class="btn btn-outline-light btn-sm me-2">Báo cáo & Backup</a>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
        <a class="navbar-brand" href="dashboard.html">Hệ Thống Giao Hàng</a>
        <div class="ms-auto">
            <a href="dashboard.html" class="btn btn-outline-light btn-sm me-2">Về Dashboard</a>
            <a href="index.html" class="btn btn-outline-danger btn-sm">Đăng xuất</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Quản lý Đơn hàng</h2>
            <button class="btn btn-primary" onclick="alert('Chức năng thêm đơn sẽ được làm ở bước sau!')">
                + Thêm đơn hàng
            </button>
        </div>

        <!-- Thanh công cụ: Tìm kiếm và Bộ lọc -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-5">
                        <input type="text" id="searchInput" class="form-control"
                            placeholder="Tìm theo mã đơn hàng (Order_ID)...">
                    </div>
                    <div class="col-md-3">
                        <select id="filterTraffic" class="form-select">
                            <option value="">-- Tất cả Giao thông --</option>
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                            <option value="Jam">Jam</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-success w-100" onclick="applyFilters()">Tìm kiếm</button>
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-secondary w-100" onclick="resetFilters()">Làm mới</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bảng dữ liệu -->
        <div class="card shadow-sm">
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Order_ID</th>
                            <th>Ngày đặt</th>
                            <th>Tuổi Agent</th>
                            <th>Đánh giá</th>
                            <th>Giao thông</th>
                            <th>Phương tiện</th>
                            <th>Thời gian giao (phút)</th>
                            <th>Hành động</th>
                        </tr>
                    </thead>
                    <tbody id="orderTableBody">
                        <!-- Dữ liệu sẽ được Javascript đổ vào đây -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/orders.js" defer></script>
</body>

</html>
