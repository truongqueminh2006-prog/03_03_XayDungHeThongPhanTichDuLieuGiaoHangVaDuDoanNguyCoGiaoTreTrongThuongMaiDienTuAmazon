<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dự đoán Thời gian Giao hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
        }

        .result-box {
            display: none;
        }
    </style>
</head>

<body>

    <!-- Thanh điều hướng -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
        <a class="navbar-brand" href="dashboard.html">Hệ Thống Giao Hàng</a>
        <div class="ms-auto">
            <a href="dashboard.html" class="btn btn-outline-light btn-sm me-2">Về Dashboard</a>
            <a href="index.html" class="btn btn-outline-danger btn-sm">Đăng xuất</a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">Dự đoán Thời gian Giao hàng (AI)</h4>
                    </div>
                    <div class="card-body p-4">
                        <p class="text-muted mb-4">Nhập các thông số của đơn hàng bên dưới để mô hình AI dự đoán thời
                            gian giao hàng thực tế (tính bằng phút).</p>

                        <form id="predictForm">
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">Tuổi người giao (Agent Age)</label>
                                    <input type="number" class="form-control" id="agentAge" value="30" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Đánh giá (Rating: 1-5)</label>
                                    <input type="number" class="form-control" id="agentRating" step="0.1" min="1"
                                        max="5" value="4.5" required>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">Mức độ Giao thông (Traffic)</label>
                                    <select class="form-select" id="traffic">
                                        <option value="Low">Low (Thông thoáng)</option>
                                        <option value="Medium">Medium (Bình thường)</option>
                                        <option value="High">High (Đông đúc)</option>
                                        <option value="Jam">Jam (Kẹt xe)</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Phương tiện (Vehicle)</label>
                                    <select class="form-select" id="vehicle">
                                        <option value="Scooter">Scooter (Xe máy)</option>
                                        <option value="Van">Van (Xe tải nhỏ)</option>
                                    </select>
                                </div>
                            </div>

                            <div class="row mb-4">
                                <div class="col-md-6">
                                    <label class="form-label">Khoảng cách (Distance - km)</label>
                                    <input type="number" class="form-control" id="distance" step="0.1" value="5.0"
                                        required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Khu vực (Area)</label>
                                    <select class="form-select" id="area">
                                        <option value="Urban">Urban (Thành thị)</option>
                                        <option value="Semi-Urban">Semi-Urban (Bán thành thị)</option>
                                        <option value="Other">Other (Khác)</option>
                                    </select>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-success w-100 py-2 fs-5">
                                🔍 Chạy Mô Hình Dự Đoán
                            </button>
                        </form>

                        <!-- Khu vực hiển thị kết quả -->
                        <div id="resultBox" class="result-box alert alert-info mt-4 text-center">
                            <h5 class="mb-2">Kết quả dự đoán:</h5>
                            <h2 class="fw-bold text-primary" id="predictionResult">-- phút</h2>
                            <small class="text-muted">Kết quả được tính toán dựa trên mô hình Random Forest của
                                nhóm.</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Gọi file JS xử lý -->
    <script src="js/predict.js" defer></script>
</body>

</html>
